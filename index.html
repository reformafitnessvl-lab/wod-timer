<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOD TIMER</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15171e;
            --accent-red: #ff2a2a;
            --accent-green: #00e676;
            --accent-yellow: #ffea00;
            --text-main: #ffffff;
            --text-muted: #7d8499;
            --border-color: #222634;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .logo span {
            color: var(--accent-red);
        }

        .config-icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 16px;
            background: var(--bg-color);
        }

        .view.active {
            display: flex;
        }

        /* ГЛАВНЫЙ ЭКРАН - ТОЛЬКО ТАБАТА И СТАРТ */
        #home-view {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-title {
            font-family: 'Teko', sans-serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .big-start-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 28px 20px;
            font-family: 'Teko', sans-serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 42, 42, 0.4);
            transition: transform 0.1s ease;
            margin-bottom: 16px;
        }

        .big-start-btn:active {
            transform: scale(0.96);
        }

        .custom-modes-link {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: 12px;
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            max-width: 380px;
            text-transform: uppercase;
        }

        /* ЭКРАН ТАЙМЕРА (БЕЗ СКРОЛЛА) */
        #timer-view {
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 10px 16px 20px 16px;
        }

        .timer-header-info {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .phase-indicator {
            font-family: 'Teko', sans-serif;
            font-size: 46px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 4px 0;
        }

        .phase-work { color: var(--accent-red); }
        .phase-rest { color: var(--accent-green); }
        .phase-prep { color: var(--accent-yellow); }

        .timer-circle-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-track, .timer-progress {
            fill: none;
            stroke-width: 10;
        }

        .timer-track {
            stroke: var(--border-color);
        }

        .timer-progress {
            stroke: var(--accent-red);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .timer-inner-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-digits {
            font-family: 'Teko', sans-serif;
            font-size: 78px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 2px;
        }

        .timer-sub-digits {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .timer-controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            flex-shrink: 0;
        }

        .control-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-pause {
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--border-color);
        }

        .btn-stop {
            background: rgba(255, 42, 42, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 42, 42, 0.3);
        }

        /* ЭКРАН НАСТРОЕК / ДРУГИХ ПРОТОКОЛОВ */
        #settings-view {
            justify-content: flex-start;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            cursor: pointer;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .mode-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 12px;
            cursor: pointer;
            text-align: left;
        }

        .mode-card.selected {
            border-color: var(--accent-red);
            background: rgba(255, 42, 42, 0.05);
        }

        .mode-title {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .mode-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .settings-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 13px; font-weight: 600; }

        .stepper { display: flex; align-items: center; gap: 10px; }
        .stepper-btn {
            background: #232733; border: none; color: white;
            width: 32px; height: 32px; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .stepper-value { font-family: 'Teko', sans-serif; font-size: 22px; width: 35px; text-align: center; }

        .settings-start-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WOD<span>TIMER</span></div>
        <button class="config-icon-btn" onclick="switchView('settings-view')">ПРОТОКОЛЫ</button>
    </header>

    <main>
        <!-- ГЛАВНЫЙ ЭКРАН (БЫСТРЫЙ СТАРТ ТАБАТЫ) -->
        <div id="home-view" class="view active">
            <div class="hero-title">КЛАССИЧЕСКАЯ<br>ТАБАТА</div>
            <div class="hero-subtitle">20 сек работа / 10 сек отдых • 8 раундов</div>
            <button class="big-start-btn" onclick="startTabataQuick()">СТАРТ</button>
            <button class="custom-modes-link" onclick="switchView('settings-view')">Другие протоколы (EMOM, AMRAP)</button>
        </div>

        <!-- ЭКРАН ТАЙМЕРА (БЕЗ СКРОЛЛА) -->
        <div id="timer-view" class="view">
            <div class="timer-header-info" id="timer-round-info">Раунд 1 / 8</div>
            <div class="phase-indicator phase-work" id="phase-title">РАБОТА</div>

            <div class="timer-circle-wrapper">
                <svg class="timer-svg" viewBox="0 0 100 100">
                    <circle class="timer-track" cx="50" cy="50" r="44"></circle>
                    <circle class="timer-progress" id="progress-ring" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
                </svg>
                <div class="timer-inner-content">
                    <div class="timer-digits" id="timer-time">20</div>
                    <div class="timer-sub-digits" id="timer-total-sub">Осталось: 04:00</div>
                </div>
            </div>

            <div class="timer-controls">
                <button class="control-btn btn-pause" id="pause-btn" onclick="togglePause()">ПАУЗА</button>
                <button class="control-btn btn-stop" onclick="stopWorkout()">СТОП</button>
            </div>
        </div>

        <!-- ЭКРАН КАСТОМНЫХ НАСТРОЕК -->
        <div id="settings-view" class="view">
            <div class="settings-header">
                <button class="back-btn" onclick="switchView('home-view')">← Назад</button>
                <div style="font-family: 'Teko'; font-size: 22px;">ВЫБОР ПРОТОКОЛА</div>
                <div style="width: 60px;"></div>
            </div>

            <div class="modes-grid">
                <div class="mode-card selected" onclick="selectMode('tabata', event)">
                    <div class="mode-title">Tabata</div>
                    <div class="mode-desc">20с работа / 10с отдых</div>
                </div>
                <div class="mode-card" onclick="selectMode('hiit', event)">
                    <div class="mode-title">HIIT</div>
                    <div class="mode-desc">Кастомный интервал</div>
                </div>
                <div class="mode-card" onclick="selectMode('emom', event)">
                    <div class="mode-title">EMOM</div>
                    <div class="mode-desc">Каждую минуту</div>
                </div>
                <div class="mode-card" onclick="selectMode('amrap', event)">
                    <div class="mode-title">AMRAP</div>
                    <div class="mode-desc">Максимум раундов</div>
                </div>
            </div>

            <div class="settings-box" id="dynamic-settings"></div>

            <button class="settings-start-btn" onclick="startCustomWorkout()">ЗАПУСТИТЬ</button>
        </div>
    </main>

    <script>
        let currentMode = 'tabata';
        
        let settings = {
            tabata: { work: 20, rest: 10, rounds: 8, prep: 10 },
            hiit: { work: 45, rest: 15, rounds: 5, prep: 10 },
            emom: { work: 60, rest: 0, rounds: 10, prep: 10 },
            amrap: { work: 600, rest: 0, rounds: 1, prep: 10 }
        };

        let timerState = {
            isRunning: false,
            isPaused: false,
            phase: 'prep',
            currentRound: 1,
            timeLeft: 0,
            phaseDuration: 0,
            intervalId: null,
            rafId: null
        };

        const circumference = 2 * Math.PI * 44;
        const progressRing = document.getElementById('progress-ring');
        progressRing.style.strokeDasharray = circumference;

        // Синтезатор всратой мемной озвучки (Web Speech API)
        function speakMeme(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.1; // Чуть быстрее для энергии
            utterance.pitch = 0.7; // Ниже голос (гнусаво-брутальный оттенок)
            window.speechSynthesis.speak(utterance);
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'settings-view') renderSettings();
        }

        function startTabataQuick() {
            currentMode = 'tabata';
            startWorkoutEngine(settings.tabata);
        }

        function startCustomWorkout() {
            startWorkoutEngine(settings[currentMode]);
        }

        function startWorkoutEngine(cfg) {
            timerState.currentRound = 1;
            timerState.isPaused = false;
            timerState.isRunning = true;

            if (cfg.prep > 0) {
                timerState.phase = 'prep';
                timerState.timeLeft = cfg.prep;
                timerState.phaseDuration = cfg.prep;
                speakMeme("Ну привет, ублюдок. Время пришло.");
            } else {
                timerState.phase = 'work';
                timerState.timeLeft = cfg.work;
                timerState.phaseDuration = cfg.work;
                speakMeme("Ты дерьмо, ублюдок, иди сюда!");
            }

            switchView('timer-view');
            startTimerInterval();
        }

        function startTimerInterval() {
            if (timerState.intervalId) clearInterval(timerState.intervalId);
            if (timerState.rafId) cancelAnimationFrame(timerState.rafId);

            timerState.intervalId = setInterval(() => {
                if (timerState.isPaused) return;

                timerState.timeLeft--;

                if (timerState.timeLeft === 3) speakMeme("Три");
                if (timerState.timeLeft === 2) speakMeme("Два");
                if (timerState.timeLeft === 1) speakMeme("Один");

                if (timerState.timeLeft < 0) {
                    nextPhase();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);

            function animLoop() {
                if (!timerState.isRunning) return;
                if (!timerState.isPaused) {
                    updateRingProgress();
                }
                timerState.rafId = requestAnimationFrame(animLoop);
            }
            animLoop();
            updateTimerDisplay();
        }

        function nextPhase() {
            const cfg = settings[currentMode];

            if (timerState.phase === 'prep') {
                speakMeme("Ты дерьмо, ублюдок, иди сюда!");
                timerState.phase = 'work';
                timerState.timeLeft = cfg.work;
                timerState.phaseDuration = cfg.work;
            } else if (timerState.phase === 'work') {
                if (cfg.rest > 0 && timerState.currentRound < cfg.rounds) {
                    speakMeme("Свободен, салага. Передохни.");
                    timerState.phase = 'rest';
                    timerState.timeLeft = cfg.rest;
                    timerState.phaseDuration = cfg.rest;
                } else if (timerState.currentRound < cfg.rounds) {
                    timerState.currentRound++;
                    speakMeme("Думал легко будет? А вот хрен, погнали снова!");
                    timerState.phase = 'work';
                    timerState.timeLeft = cfg.work;
                    timerState.phaseDuration = cfg.work;
                } else {
                    finishWorkout();
                    return;
                }
            } else if (timerState.phase === 'rest') {
                timerState.currentRound++;
                speakMeme("Взлет! Работай!");
                timerState.phase = 'work';
                timerState.timeLeft = cfg.work;
                timerState.phaseDuration = cfg.work;
            }

            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const cfg = settings[currentMode];
            const phaseTitle = document.getElementById('phase-title');
            const roundInfo = document.getElementById('timer-round-info');
            const digits = document.getElementById('timer-time');
            const subDigits = document.getElementById('timer-total-sub');

            digits.innerText = timerState.timeLeft;

            if (currentMode === 'amrap') {
                roundInfo.innerText = `AMRAP ТРЕНИРОВКА`;
            } else {
                roundInfo.innerText = `Раунд ${timerState.currentRound} / ${cfg.rounds}`;
            }

            if (timerState.phase === 'prep') {
                phaseTitle.innerText = 'ПОДГОТОВКА';
                phaseTitle.className = 'phase-indicator phase-prep';
                progressRing.style.stroke = 'var(--accent-yellow)';
            } else if (timerState.phase === 'work') {
                phaseTitle.innerText = 'РАБОТА';
                phaseTitle.className = 'phase-indicator phase-work';
                progressRing.style.stroke = 'var(--accent-red)';
            } else if (timerState.phase === 'rest') {
                phaseTitle.innerText = 'ОТДЫХ';
                phaseTitle.className = 'phase-indicator phase-rest';
                progressRing.style.stroke = 'var(--accent-green)';
            }

            const m = Math.floor(timerState.timeLeft / 60);
            const s = timerState.timeLeft % 60;
            subDigits.innerText = `Осталось: ${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateRingProgress() {
            const fraction = timerState.phaseDuration > 0 ? (timerState.timeLeft / timerState.phaseDuration) : 0;
            const offset = circumference - (fraction * circumference);
            progressRing.style.strokeDashoffset = offset;
        }

        function togglePause() {
            timerState.isPaused = !timerState.isPaused;
            const btn = document.getElementById('pause-btn');
            btn.innerText = timerState.isPaused ? 'ПРОДОЛЖИТЬ' : 'ПАУЗА';
            if (timerState.isPaused) speakMeme("Пауза для слабаков");
        }

        function stopWorkout() {
            timerState.isRunning = false;
            if (timerState.intervalId) clearInterval(timerState.intervalId);
            if (timerState.rafId) cancelAnimationFrame(timerState.rafId);
            window.speechSynthesis.cancel();

            switchView('home-view');
            document.getElementById('pause-btn').innerText = 'ПАУЗА';
        }

        function finishWorkout() {
            speakMeme("Ты сделал это, чемпион! Но ты всё еще дерьмо.");
            stopWorkout();
        }

        function selectMode(mode, event) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(card => card.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            renderSettings();
        }

        function renderSettings() {
            const container = document.getElementById('dynamic-settings');
            const cfg = settings[currentMode];
            let html = '';

            if (currentMode === 'amrap') {
                html += createStepperHTML('Общее время (мин)', 'workMinutes', Math.floor(cfg.work / 60), 1, 60);
            } else {
                html += createStepperHTML('Работа (сек)', 'work', cfg.work, 5, 300);
                if (cfg.rest > 0 || currentMode === 'tabata' || currentMode === 'hiit') {
                    html += createStepperHTML('Отдых (сек)', 'rest', cfg.rest, 0, 120);
                }
                html += createStepperHTML('Раунды', 'rounds', cfg.rounds, 1, 50);
            }
            html += createStepperHTML('Подготовка (сек)', 'prep', cfg.prep, 0, 30);

            container.innerHTML = html;
        }

        function createStepperHTML(label, key, value, min, max) {
            return `
                <div class="setting-row">
                    <span class="setting-label">${label}</span>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeSetting('${key}', -1, ${min}, ${max})">-</button>
                        <span class="stepper-value" id="val-${key}">${value}</span>
                        <button class="stepper-btn" onclick="changeSetting('${key}', 1, ${min}, ${max})">+</button>
                    </div>
                </div>
            `;
        }

        function changeSetting(key, delta, min, max) {
            let cfg = settings[currentMode];
            if (key === 'workMinutes') {
                let currentMins = Math.floor(cfg.work / 60);
                let newMins = Math.max(min, Math.min(max, currentMins + delta));
                cfg.work = newMins * 60;
                document.getElementById('val-workMinutes').innerText = newMins;
                return;
            }
            cfg[key] = Math.max(min, Math.min(max, cfg[key] + delta));
            document.getElementById(`val-${key}`).innerText = cfg[key];
        }
    </script>
</body>
</html>
